name: Update cslib documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

# env:
#   LAKE_NO_CACHE: true

jobs:

  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cslib-community.github.io
        uses: actions/checkout@v6

      - name: Checkout cslib
        uses: actions/checkout@v6
        with:
          repository: leanprover/cslib
          path: cslib

      - name: Install Lean and build
        uses: leanprover/lean-action@v1
        with:
          build-args: --wfail
          test: false
          lint: false

      - name: Generate website
        run: |
          lake run generate

      # - name: Set up elan for cslib docs
      #   working-directory: cslib/docs
      #   run: |
      #     elan default $(cat lean-toolchain)

      # - name: Get cache
      #   working-directory: cslib/docs
      #   run: |
      #     lake exe cache get

      # - name: Build cslib docs
      #   working-directory: cslib/docs
      #   run: |
      #     env LEAN_ABORT_ON_PANIC=1 lake build Cslib:docs

      # - name: Prepare docs in api folder
      #   run: |
      #     mkdir -p _cslib.org/api
      #     cp -r cslib/docs/doc/* _cslib.org/api/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_cslib.org'

  deploy:
    needs: build-docs
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
